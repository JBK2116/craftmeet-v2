spring.application.name=craftmeet-backend

# SPRING JPA ACCESS
spring.jpa.hibernate.ddl-auto=validate

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# SPRING AI (OpenAI)
# Empty key = no-auth mode (Set a real key once openai integration is needed) 
spring.ai.openai.api-key=

# JWT TOKENS
jwt.issuer="craftmeet"
jwt.secret=${SPRING_JWT_SECRET:UHR91x5wFVCHwm8PD56oJ3oehNfSYbSDjCKamI1JYYc=}
jwt.refresh-token-expiration=604800000
jwt.access-token-expiration=900000

# Verify Email TOKENS
verify.token.expiration=86400000
verify.token.secret=${SPRING_VERIFY_TOKEN_SECRET:UHR91x5wFVCHwm8PD56oJ3oehNfSYbSDjCKamI1JYYc=}
verify.token.cooldown=900000
